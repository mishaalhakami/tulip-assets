<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>كتالوج توليب</title>
<link rel="icon" href="https://cdn.files.salla.network/other/530765564/49adb57c-1416-44d2-aa6b-6fb32ef04fec-original.webp">
<meta name="description" content="كتالوج توليب لمستلزمات تنسيق الورد بأسعار الجملة — اختر منتجاتك واطلب عرض سعر عبر واتساب">
<meta property="og:title" content="كتالوج توليب">
<meta property="og:description" content="مستلزمات تنسيق الورد بأسعار الجملة — اطلب عرض سعر عبر واتساب">
<meta name="theme-color" content="#8A5A52">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#8A5A52; --brand-d:#6E453E; --brand-l:#F4E9E6; --brand-xl:#FBF6F4;
  --ink:#2B2220; --muted:#7A6B67; --line:#EADFDB; --bg:#FFFCFB; --card:#fff;
  --ok:#2E7D5B; --wa:#1FA855; --warn:#B26A00;
  --r:16px; --sh:0 1px 2px rgba(60,30,20,.06),0 6px 18px rgba(60,30,20,.06);
  --hfont:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* header */
.hero{background:radial-gradient(120% 90% at 50% 0%,#fff 0%,var(--brand-xl) 55%,#F5E9E5 100%);padding:18px 0 16px;text-align:center;border-bottom:1px solid var(--line)}
.hero .logo{height:104px;width:auto;margin:0 auto}
.hero .tag{font-family:var(--hfont);font-size:16px;color:var(--brand-d);margin:4px 0 0;font-weight:600}
.pills{display:flex;gap:5px;flex-wrap:nowrap;justify-content:center;margin-top:8px}
.pills span{font-size:11.5px;white-space:nowrap;background:#fff;border:1px solid var(--line);color:var(--brand-d);border-radius:999px;padding:2px 9px}
@media(max-width:360px){.pills span{font-size:10.5px;padding:2px 7px}}@media(max-width:335px){.pills{gap:3px}.pills span{font-size:9.5px;padding:2px 5px}}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:640px;margin:14px auto 0}
.how div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 4px;font-size:12px;line-height:1.4;color:var(--muted)}
body.quote .how,body.quote .pills{display:none}
.how div{position:relative;transition:transform .3s;animation:stepIn .5s ease both,stepGlow 4.5s ease-in-out 1s infinite}
.how div:nth-child(1){animation-delay:.05s,1s}
.how div:nth-child(2){animation-delay:.2s,2.5s}
.how div:nth-child(3){animation-delay:.35s,4s}
.how div b{animation:numPop 4.5s ease-in-out 1s infinite}
.how div:nth-child(2) b{animation-delay:2.5s}
.how div:nth-child(3) b{animation-delay:4s}
@keyframes stepIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes stepGlow{0%,30%,100%{transform:scale(1);border-color:var(--line);box-shadow:none;background:#fff}
  10%,20%{transform:scale(1.07);border-color:var(--brand);box-shadow:0 8px 20px rgba(138,90,82,.22);background:var(--brand-xl)}}
@keyframes numPop{0%,30%,100%{transform:scale(1)}10%{transform:scale(1.3) rotate(-8deg)}20%{transform:scale(1.1)}}
@media (prefers-reduced-motion: reduce){.how div,.how div b{animation:none!important}}
.how b{display:grid;place-items:center;width:22px;height:22px;margin:0 auto 3px;border-radius:50%;background:var(--brand);color:#fff;font-size:13px}
.how strong{display:block;color:var(--ink);font-size:13.5px;font-weight:600}

/* sticky nav */
.nav{position:sticky;top:0;z-index:20;background:rgba(255,252,251,.96);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line);box-shadow:0 4px 14px rgba(60,30,20,.05)}
.nav .wrap{padding-top:10px;padding-bottom:8px}
.search{display:flex;gap:8px;align-items:center}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-size:15px;outline:none}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;font-size:14px;white-space:nowrap}
.iconbtn:hover{border-color:var(--brand)}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:10px;padding:4px 2px 6px;scroll-behavior:smooth}
.tabs::-webkit-scrollbar{display:none}
.tab{--c:var(--brand);flex:none;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:7px 12px 6px;min-width:76px;display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .18s,background .18s,box-shadow .18s;color:var(--muted)}
.tab i{font-style:normal;font-size:22px;line-height:1.2;filter:saturate(.8)}
.tab span{font-size:13px;font-weight:500;white-space:nowrap}
.tab small{font-size:11px;opacity:.8}
.tab.on{background:var(--c);border-color:var(--c);color:#fff;transform:scale(1.08);box-shadow:0 6px 16px color-mix(in srgb,var(--c) 35%,transparent)}
.tab.on i{filter:none}
.tab.on span{font-weight:700}

/* section banner */
.banner{--c:var(--brand);margin-top:16px;border-radius:18px;padding:14px 16px;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 70%,#000));display:flex;align-items:center;gap:12px;position:relative;overflow:hidden}
.banner:after{content:"";position:absolute;left:-30px;bottom:-50px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.1)}
.banner .ic{font-size:34px;width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.banner h2{font-family:var(--hfont);margin:0;font-size:21px}
.banner p{margin:0;font-size:13px;opacity:.9}
.banner .pos{margin-inline-start:auto;font-size:12.5px;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 10px;white-space:nowrap;position:relative;z-index:1}
.swipe{display:inline-flex;align-items:center;gap:10px;margin:12px auto 0;background:#fff;border:1px dashed color-mix(in srgb,var(--brand) 45%,transparent);border-radius:999px;padding:7px 16px 7px 12px;font-size:13.5px;color:var(--brand-d);font-weight:500}
.swipe .hand{font-size:22px;display:inline-block;animation:hand 1.8s ease-in-out infinite}
.swipe .arr{opacity:.55;font-size:12px}
@keyframes hand{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(9px) rotate(8deg)}75%{transform:translateX(-9px) rotate(-8deg)}}
.tabwrap{position:relative}
.tarrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--brand-d);font-size:16px;font-weight:700;display:grid;place-items:center;box-shadow:0 2px 8px rgba(60,30,20,.15);transition:opacity .2s;padding:0;line-height:1}
.tarrow.r{right:-6px}.tarrow.l{left:-6px}
.tarrow.off{opacity:0;pointer-events:none}
.tabwrap:before,.tabwrap:after{content:"";position:absolute;top:0;bottom:0;width:34px;z-index:1;pointer-events:none;transition:opacity .2s}
.tabwrap:before{right:0;background:linear-gradient(to left,rgba(255,252,251,.95),transparent)}
.tabwrap:after{left:0;background:linear-gradient(to right,rgba(255,252,251,.95),transparent)}
.tabwrap.atR:before,.tabwrap.atL:after{opacity:0}
@media (prefers-reduced-motion: reduce){.swipe .hand{animation:none}}
.pager{display:flex;gap:10px;margin-top:18px}
.pager button{--c:var(--brand);flex:1;border:1.5px solid var(--c);color:var(--c);background:#fff;border-radius:14px;padding:12px;font-weight:600;font-size:14px}
.pager button.nx{background:var(--c);color:#fff}
#list{touch-action:pan-y}
.subs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 0;padding:2px 16px 4px}
.subs::-webkit-scrollbar{display:none}
.sub{flex:none;border:1.5px solid color-mix(in srgb,var(--c) 35%,var(--line));background:#fff;color:var(--c);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600;transition:.15s}
.sub b{font-weight:500;font-size:11.5px;opacity:.7}
.sub.on{background:var(--c);border-color:var(--c);color:#fff;transform:scale(1.04)}
.sub.on b{opacity:.85}
.sub i{font-style:normal;font-size:11px;margin-inline-start:2px}
.subinfo{font-size:12.5px;color:var(--muted);margin:8px 0 0;text-align:center}
.slide-l{animation:slideL .28s ease}
.slide-r{animation:slideR .28s ease}
@keyframes slideL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}

/* sections & grid */
main{padding:8px 0 140px}
.sec{scroll-margin-top:130px;margin-top:22px}
.sec h2{font-family:var(--hfont);font-size:20px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.sec h2 small{font-family:"IBM Plex Sans Arabic";font-size:13px;color:var(--muted);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh);transition:border-color .15s}
.card.in{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-l),var(--sh)}
.ph{position:relative;aspect-ratio:3/4;background:var(--brand-xl);cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover}
.code{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.92);border-radius:8px;padding:2px 7px;font-size:11.5px;font-weight:600;direction:ltr;letter-spacing:.2px}
.qbadge{position:absolute;top:8px;left:8px;background:var(--brand);color:#fff;border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-size:13px;font-weight:600;padding:0 7px}
.body{padding:10px 11px 11px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-size:14px;font-weight:500;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.unit{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;background:var(--brand-xl);border:1px solid var(--line);color:var(--brand-d);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:600;line-height:1.5}
.unit span{font-size:12px}
.line .unit{margin-top:3px;font-size:11.5px;padding:1px 7px}
.price{font-size:13px;color:var(--muted)}
.price.has{color:var(--brand-d);font-weight:700;font-size:15px}
.act{margin-top:auto}
.add{width:100%;border:0;background:var(--brand);color:#fff;border-radius:11px;padding:9px;font-weight:600;font-size:14px}
.add:hover{background:var(--brand-d)}
.step{display:flex;align-items:center;border:1px solid var(--brand);border-radius:11px;overflow:hidden;background:#fff}
.step button{border:0;background:var(--brand-l);width:38px;height:38px;font-size:20px;font-weight:600;color:var(--brand-d);flex:none}
.step input{flex:1;min-width:0;border:0;text-align:center;font-weight:700;font-size:15px;outline:none;height:38px;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.empty{text-align:center;color:var(--muted);padding:50px 10px}

/* bottom bar */
.bar{position:fixed;inset:auto 0 0 0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(60,30,20,.08);transform:translateY(110%);transition:transform .25s}
.bar.show{transform:none}
.bar .wrap{display:flex;align-items:center;gap:12px;padding:0}
.bar .sum{flex:1;min-width:0}
.bar .sum b{font-size:16px}
.bar .sum div{font-size:13px;color:var(--muted)}
.primary{border:0;background:var(--brand);color:#fff;border-radius:12px;padding:12px 18px;font-weight:600;font-size:15px}
.primary:hover{background:var(--brand-d)}
.primary:disabled{opacity:.55;cursor:default}
.wa{background:var(--wa)}
.wa:hover{background:#178c46}
.ghost{color:var(--ink);border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font-weight:500;font-size:14px}

.fly{position:fixed;z-index:80;object-fit:cover;pointer-events:none;box-shadow:0 8px 24px rgba(60,30,20,.25)}
.flyplus{direction:ltr;position:fixed;z-index:80;width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;pointer-events:none;box-shadow:0 4px 12px rgba(60,30,20,.3)}
.bar.bump #openCart{animation:pop .45s ease}
.bar.bump .sum b{animation:pulse .45s ease;display:inline-block}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.12)}70%{transform:scale(.96)}100%{transform:scale(1)}}
@keyframes pulse{0%{transform:scale(1);color:inherit}40%{transform:scale(1.25);color:var(--brand)}100%{transform:scale(1)}}

.step button{transition:transform .12s,background .12s,color .12s}
.step button:active{transform:scale(.86);background:var(--brand);color:#fff}
.step input.tk-up{animation:tkUp .32s cubic-bezier(.2,.9,.3,1.3)}
.step input.tk-dn{animation:tkDn .32s cubic-bezier(.2,.9,.3,1.3)}
@keyframes tkUp{0%{transform:translateY(70%);opacity:0}100%{transform:none;opacity:1}}
@keyframes tkDn{0%{transform:translateY(-70%);opacity:0}100%{transform:none;opacity:1}}
.step.hit-up{animation:hitUp .4s ease}
.step.hit-dn{animation:hitDn .4s ease}
@keyframes hitUp{0%{box-shadow:0 0 0 0 rgba(46,125,91,.45)}100%{box-shadow:0 0 0 8px rgba(46,125,91,0)}}
@keyframes hitDn{0%{box-shadow:0 0 0 0 rgba(179,71,59,.4)}100%{box-shadow:0 0 0 8px rgba(179,71,59,0)}}
.delta{direction:ltr;position:fixed;z-index:85;pointer-events:none;font-weight:700;font-size:15px;padding:2px 9px;border-radius:999px;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.delta.up{background:var(--ok)}.delta.dn{background:#B3473B}
.line.flash{animation:lineFlash .55s ease}
@keyframes lineFlash{0%{background:#fff}30%{background:var(--brand-xl);border-color:var(--brand)}100%{background:#fff}}
.line.out{animation:lineOut .28s ease forwards;overflow:hidden}
@keyframes lineOut{to{opacity:0;transform:translateX(-40px);max-height:0;padding-top:0;padding-bottom:0;margin-bottom:0}}
.tot.pulse span:first-child,.tot.pulse b{animation:pulse .45s ease;display:inline-block}
@media (prefers-reduced-motion: reduce){.step input,.step,.line,.delta{animation:none!important}}

/* drawer */
.dim{position:fixed;inset:0;background:rgba(30,15,10,.45);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.dim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:41;top:0;bottom:0;left:0;width:min(460px,100%);background:var(--bg);transform:translateX(-102%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.show{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:#fff}
.dh h3{margin:0;font-family:var(--hfont);font-size:18px}
.dhact{display:flex;gap:8px;align-items:center}
.cont{border:1px solid var(--brand);background:#fff;color:var(--brand-d);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600}
.cont:hover{background:var(--brand-xl)}
.x{border:0;background:var(--brand-xl);width:36px;height:36px;border-radius:10px;font-size:18px}
.db{flex:1;overflow:auto;padding:12px 16px}
.df{border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fff}
.line{max-height:220px;display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px}
.line img{width:56px;height:74px;object-fit:cover;border-radius:9px;background:var(--brand-xl);flex:none}
.line .info{flex:1;min-width:0}
.line .info .n{font-size:13.5px;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.line .info .c{font-size:12px;color:var(--muted);direction:ltr;text-align:right}
.line .step{width:118px;flex:none}
.line .step button{width:32px;height:34px;font-size:18px}
.line .step input{height:34px;font-size:14px}
.del{border:0;background:none;color:#B3473B;font-size:12.5px;padding:2px 0}
.lp{font-size:12.5px;color:var(--brand-d);font-weight:600}
.form{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.form h4{margin:0 0 10px;font-size:15px}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.fld input,.fld textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;outline:none;background:#fff}
.fld textarea{min-height:60px;resize:vertical}
.fld input:focus,.fld textarea:focus{border-color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:14px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.err{color:#B3473B;font-size:13px;margin:6px 0 0;min-height:1em}
.tot{display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px;color:var(--muted)}
.tot b{color:var(--ink)}
.row2{display:flex;gap:8px}
.row2>*{flex:1}
.mini{font-size:12.5px;color:var(--muted);text-align:center;margin-top:8px}
.edithint{background:#FFF6E5;border:1px solid #F1D9A8;color:#7A4E00;border-radius:12px;padding:9px 12px;font-size:13.5px;margin-bottom:10px;display:flex;gap:8px;align-items:center;justify-content:space-between}

/* lightbox */
.lb{position:fixed;inset:0;z-index:60;background:rgba(20,10,8,.9);display:none;align-items:center;justify-content:center;padding:20px;flex-direction:column;gap:12px}
.lb.show{display:flex}
.lb img{max-height:78vh;border-radius:12px}
.lb .cap{color:#fff;text-align:center;font-size:15px}
.lb .cap span{display:block;opacity:.75;font-size:13px;direction:ltr}

/* toast */
.toast{position:fixed;z-index:70;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* quote page */
.qhead{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:18px;box-shadow:var(--sh)}
.qhead h2{margin:0;font-family:var(--hfont);font-size:22px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:14px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:500}
.status{display:inline-block;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600}
.st-new{background:#FFF3DC;color:var(--warn)}
.st-replied{background:#E4F1FB;color:#1E5E8C}
.st-sold{background:#E3F4EC;color:var(--ok)}
.st-cancelled{background:#F3E3E1;color:#9A3B30}
.qlist{margin-top:14px}
.qactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.qactions>*{flex:1 1 160px}
.sticky-save{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
footer{color:var(--muted);font-size:13px;text-align:center;padding:24px 0 30px}
footer a{color:var(--brand-d)}

.hidden{display:none!important}

/* print */
.printout{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  body>*:not(.printout){display:none!important}
  .printout{display:block!important;color:#000}
  .printout h1{font-family:var(--hfont);font-size:20px;margin:0 0 2px;color:var(--brand)}
  .printout .sub{font-size:12px;color:#555;margin-bottom:10px}
  .printout table{width:100%;border-collapse:collapse;font-size:12px}
  .printout th,.printout td{border-bottom:1px solid #ddd;padding:6px;text-align:right;vertical-align:middle}
  .printout th{background:#f6eeec}

  if(RM){bump();return}
  const r=btn.getBoundingClientRect(),t=barTarget();const d=document.createElement("div");d.className="flyplus";d.textContent="+1";
  Object.assign(d.style,{left:(r.left+r.width/2-16)+"px",top:(r.top-4)+"px"});document.body.appendChild(d);
  d.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:"translate(0,-22px) scale(1.25)",opacity:1,offset:.25},
             {transform:`translate(${t.x-r.left-r.width/2}px,${t.y-r.top}px) scale(.6)`,opacity:.3}],{duration:560,easing:"ease-in"}).onfinish=()=>{d.remove();bump()};
}
function updateBar(){const t=totals(cart);$("#bar").classList.toggle("show",t.n>0);
  $("#barCount").textContent=num(t.n)+" منتج"+(editing?` · تعديل طلب #${editing.id}`:"");
  $("#barSub").textContent=num(t.pcs)+" قطعة"+(t.allPriced&&t.n?" · "+money(t.sum):"")}

/* ---------- drawer ---------- */
function openCart(){renderCart();$("#drawer").classList.add("show");$("#dim").classList.add("show")}
function closeCart(){$("#drawer").classList.remove("show");$("#dim").classList.remove("show")}
$("#openCart").onclick=openCart;$("#closeCart").onclick=closeCart;$("#contShop").onclick=closeCart;$("#dim").onclick=closeCart;
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeCart();$("#lb").classList.remove("show")}});

function lineHTML(p,q,priceOverride){
  const pr=priceOverride!=null?Number(priceOverride):(SHOW_PRICES&&p.price!=null?p.price:null);
  return `<div class="line" data-sku="${esc(p.sku)}"><img src="${esc(p.img)}" alt="" loading="lazy">
    <div class="info"><div class="n">${esc(p.name)}</div><div class="c">${esc(p.sku)}</div>${unitHTML(p.unit)}
      ${pr!=null?`<div class="lp">${money(pr)} × ${num(q)} = ${money(pr*q)}</div>`:""}
      <button class="del" data-a="del">حذف</button></div>
    <div class="step"><button data-a="inc">+</button><input type="number" inputmode="numeric" min="1" value="${q}" data-a="set"><button data-a="dec">−</button></div></div>`}
function renderCart(keepForm){
  const ks=Object.keys(cart), body=$("#cartBody");
  const formState=keepForm?readForm():null;
  if(!ks.length){body.innerHTML=`<div class="empty">طلبك فاضي. أضف منتجات من الكتالوج 🌷</div>`+(editing?editHint():"");$("#cartFoot").innerHTML=`<button class="ghost" style="width:100%" id="backShop">رجوع للكتالوج</button>`;$("#backShop").onclick=closeCart;bindEdit();return}
  const t=totals(cart);
  body.innerHTML=(editing?editHint():"")+ks.map(k=>lineHTML(BY[k],cart[k])).join("")+`
    <div class="form"><h4>بياناتك عشان نرسل لك عرض السعر</h4>
      <div class="fld"><label>الاسم</label><input id="fName" autocomplete="name" value="${esc(cust.name)}" placeholder="مثلاً: محمد"></div>
      <div class="fld"><label>المدينة</label><input id="fCity" value="${esc(cust.city)}" placeholder="مثلاً: الرياض"></div>
      <div class="fld"><label>نوع العميل</label><div class="chips" id="fType">${TYPES.map(x=>`<button type="button" class="chip${cust.type===x?" on":""}" data-t="${x}">${x}</button>`).join("")}</div></div>
      <div class="fld"><label>ملاحظة (اختياري)</label><textarea id="fNote">${esc(cust.note||"")}</textarea></div>
      <p class="err" id="fErr"></p></div>`;
  if(formState) writeForm(formState);
  $("#fType").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;cust.type=b.dataset.t;$("#fType").querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));save("tc_cust",cust)};
  ["fName","fCity","fNote"].forEach(id=>$("#"+id).addEventListener("input",()=>{const f=readForm();cust={...cust,...f};save("tc_cust",cust)}));
  $("#cartFoot").innerHTML=`<div class="tot"><span>${num(t.n)} منتج · ${num(t.pcs)} قطعة</span>${t.allPriced?`<b>${money(t.sum)}</b>`:`<span>السعر يوصلك بالعرض</span>`}</div>
    <button class="primary wa" style="width:100%" id="send">${editing?`حفظ التعديل وإرساله بالواتساب`:`اطلب عرض سعر عبر واتساب`}</button>
    <div class="row2" style="margin-top:8px"><button class="ghost" id="dlCart">⬇︎ تحميل الطلب</button><button class="ghost" id="clr">حذف كامل الطلب</button></div>
    <div class="mini">بعد الإرسال يوصلك رابط تقدر تعدّل فيه طلبك</div>`;
  $("#send").onclick=submit;$("#dlCart").onclick=()=>printCart(cart,{title:"ملخص الطلب"});
  $("#clr").onclick=()=>{if(confirmClear()){const ks2=Object.keys(cart);cart={};save("tc_cart",cart);ks2.forEach(refreshCard);updateBar();renderCart()}};
  bindEdit();
}
let clearArmed=0;function confirmClear(){if(Date.now()-clearArmed<3000)return true;clearArmed=Date.now();toast("اضغط «حذف كامل الطلب» مرة ثانية للتأكيد");return false}
function editHint(){return `<div class="edithint"><span>أنت تعدّل طلب رقم #${editing.id}</span><button class="ghost" style="padding:5px 10px" id="cancelEdit">طلب جديد بدلاً منه</button></div>`}
function bindEdit(){const b=$("#cancelEdit");if(b)b.onclick=()=>{editing=null;save("tc_edit",null);updateBar();renderCart(true)}}
function readForm(){return{name:($("#fName")||{}).value||"",city:($("#fCity")||{}).value||"",note:($("#fNote")||{}).value||""}}
function writeForm(f){if($("#fName"))$("#fName").value=f.name;if($("#fCity"))$("#fCity").value=f.city;if($("#fNote"))$("#fNote").value=f.note}
$("#cartBody").addEventListener("click",e=>{const a=e.target.closest("[data-a]");if(!a)return;const ln=a.closest(".line");if(!ln)return;const sku=ln.dataset.sku;
  if(a.dataset.a==="inc"){markFx(sku,1,a);setQty(sku,cart[sku]+1)}
  else if(a.dataset.a==="dec"){if(cart[sku]<=1){removeLine(ln,()=>setQty(sku,0));return}markFx(sku,-1,a);setQty(sku,cart[sku]-1)}
  else if(a.dataset.a==="del"){removeLine(ln,()=>{setQty(sku,0);toast("انحذف من الطلب")})}});
$("#cartBody").addEventListener("change",e=>{if(e.target.dataset.a==="set"){const sku=e.target.closest(".line").dataset.sku;setQty(sku,e.target.value)}});

function buildMsg(o){ // o:{edit,id,name,city,type,note,list:[{sku,name,qty}],link}
  const SEP="━━━━━━━━━━━━━━";const pcs=o.list.reduce((a,x)=>a+x.qty,0);
  const out=[o.edit?"✏️ *تعديل طلب عرض سعر | توليب*":"🌷 *طلب عرض سعر | توليب*",`رقم الطلب: *#${o.id}*`,SEP,
    `👤 الاسم: ${o.name}`,`📍 المدينة: ${o.city}`];
  if(o.type) out.push(`🏷️ نوع العميل: ${o.type}`);
  out.push(SEP,`🛒 *المنتجات* (${o.list.length} منتج • ${pcs} قطعة)`,"");
  o.list.forEach((x,i)=>{out.push(`*${i+1}. ${x.name}*`,`الكود: ${x.sku}`,`الكمية: *${x.qty}*`+(x.unit?` (${x.unit})`:""),"")});
  out.push(SEP);
  if(o.note) out.push(`📝 ملاحظة: ${o.note}`,"");
  out.push("📄 *تفاصيل الطلب بالصور وتعديله:*",o.link);
  return out.join("\n");
}
function waText(head,id,c,link){
  return buildMsg({edit:head.startsWith("تعديل"),id,name:cust.name,city:cust.city,type:cust.type,note:cust.note,
    list:Object.keys(c).map(k=>({sku:k,name:BY[k]?BY[k].name:"",unit:BY[k]&&BY[k].unit,qty:c[k]})),link});
}
async function submit(){
  const f=readForm();cust={...cust,...f};save("tc_cust",cust);const err=$("#fErr");
  if(cust.name.trim().length<2){err.textContent="اكتب اسمك لو سمحت";$("#fName").focus();return}
  if(cust.city.trim().length<2){err.textContent="اكتب مدينتك";$("#fCity").focus();return}
  if(!cust.type){err.textContent="اختر نوع العميل";return}
  err.textContent="";const btn=$("#send");btn.disabled=true;btn.textContent="جاري الإرسال…";
  const items=Object.keys(cart).map(k=>({sku:k,qty:cart[k]}));
  try{
    let id,token,head;
    if(editing){
      const r=await rpc("cat_quote_update",{p_token:editing.token,p_items:items});
      if(r&&r.error==="locked"){err.textContent="هذا الطلب مقفل لأنه تم أو انلغى. أرسله كطلب جديد.";editing=null;save("tc_edit",null);btn.disabled=false;renderCart(true);return}
      if(r&&r.error) throw new Error(r.error);
      id=editing.id;token=editing.token;head="تعديل طلب عرض سعر";
    }else{
      const r=await rpc("cat_quote_create",{p_name:cust.name,p_city:cust.city,p_type:cust.type,p_items:items,p_note:cust.note||null});
      if(r&&r.error==="busy"){err.textContent="فيه ضغط حالياً، جرّب بعد دقائق أو راسلنا مباشرة.";btn.disabled=false;btn.textContent="اطلب عرض سعر عبر واتساب";return}
      if(!r||r.error) throw new Error(r&&r.error);
      id=r.id;token=r.token;head="طلب عرض سعر";
    }
    const link=BASE+"#q="+token;
    const wa="https://wa.me/"+WA+"?text="+encodeURIComponent(waText(head,id,cart,link));
    const sent={...cart};
    cart={};save("tc_cart",cart);editing=null;save("tc_edit",null);
    Object.keys(sent).forEach(refreshCard);updateBar();
    $("#cartBody").innerHTML=`<div class="empty" style="padding:30px 6px"><div style="font-size:42px">✅</div><h3 style="margin:6px 0">انحفظ طلبك رقم #${id}</h3>
      <p>الحين بيفتح الواتساب والرسالة جاهزة، بس اضغط إرسال.</p>
      <a class="primary wa" style="display:block;text-decoration:none;margin:12px 0" href="${esc(wa)}" target="_blank" rel="noopener">فتح الواتساب وإرسال الطلب</a>
      <a class="ghost" style="display:block;text-decoration:none" href="#q=${esc(token)}" id="toQuote">عرض طلبي وتعديله</a></div>`;
    $("#cartFoot").innerHTML="";$("#toQuote").onclick=()=>closeCart();
    location.href=wa;
  }catch(e){err.textContent="صار خطأ في الإرسال، تأكد من الإنترنت وجرّب مرة ثانية.";btn.disabled=false;btn.textContent=editing?"حفظ التعديل وإرساله بالواتساب":"اطلب عرض سعر عبر واتساب"}
}

/* ---------- printing / download ---------- */
function printCart(c,opt){
  const ks=Object.keys(c),t=totals(c),pr=opt.prices||null;
  let sum=0,all=true;
  const rows=ks.map((k,i)=>{const p=BY[k]||opt.lookup&&opt.lookup[k];if(!p)return"";const price=pr?pr[k]:(SHOW_PRICES?p.price:null);
    if(price!=null&&price!=="")sum+=Number(price)*c[k];else all=false;
    return `<tr><td>${i+1}</td><td><img src="${esc(p.img)}"></td><td dir="ltr">${esc(k)}</td><td>${esc(p.name)}${p.unit?`<br><small>${esc(p.unit)}</small>`:""}</td><td>${num(c[k])}</td>${pr||SHOW_PRICES?`<td>${price!=null&&price!==""?money(price):"—"}</td><td>${price!=null&&price!==""?money(price*c[k]):"—"}</td>`:""}</tr>`}).join("");
  const hasP=pr||SHOW_PRICES;
  $("#printout").innerHTML=`<h1>توليب · ${esc(opt.title)}</h1><div class="sub">${esc(opt.sub||"")} ${dt(Date.now())} · واتساب 0505901150</div>
    <table><thead><tr><th>#</th><th></th><th>الكود</th><th>المنتج</th><th>الكمية</th>${hasP?"<th>السعر</th><th>الإجمالي</th>":""}</tr></thead><tbody>${rows}</tbody></table>
    <p style="margin-top:10px;font-size:13px"><b>${num(t.n||ks.length)} منتج · ${num(ks.reduce((a,k)=>a+c[k],0))} قطعة</b>${hasP&&all?` · الإجمالي ${money(sum)}`:""}</p>`;
  afterImages(()=>window.print());
}
function printCatalog(){
  const q=$("#q").value.trim();
  const html=(q?secs():[CUR]).map(s=>{const ps=ITEMS.filter(p=>p.sec===s&&matches(p,q));if(!ps.length)return"";
    return `<h3>${esc(SEC_TITLE[s]||s)}</h3>`+ps.map(p=>`<div><img src="${esc(p.img)}"><p><b dir="ltr">${esc(p.sku)}</b><br>${esc(p.name)}${p.unit?"<br>"+esc(p.unit):""}${SHOW_PRICES&&p.price!=null?"<br>"+money(p.price):""}</p></div>`).join("")}).join("");
  $("#printout").innerHTML=`<h1>كتالوج توليب${q?"":" · "+esc(SEC_TITLE[CUR]||CUR)}</h1><div class="sub">مستلزمات تنسيق الورد · للطلب واتساب 0505901150</div><div class="pgrid">${html}</div>`;
  toast("جاري تجهيز الملف… اختر «حفظ كملف PDF»");
  afterImages(()=>window.print());
}
function afterImages(cb){const imgs=[...$("#printout").querySelectorAll("img")];let left=imgs.length;if(!left)return cb();
  const done=()=>{if(--left<=0){clearTimeout(tm);cb()}};const tm=setTimeout(()=>{left=0;cb()},8000);
  imgs.forEach(i=>{i.loading="eager";if(i.complete)done();else{i.onload=done;i.onerror=done}})}
$("#dlBtn").onclick=printCatalog;

/* ---------- quote page ---------- */
let QUOTE=null,QEDIT={};
function route(){
  const m=location.hash.match(/^#q=([0-9a-f-]{36})$/i);
  $("#catalogView").classList.toggle("hidden",!!m);$("#quoteView").classList.toggle("hidden",!m);
  $("#bar").style.display=m?"none":"";document.body.classList.toggle("quote",!!m);
  if(m){closeCart();loadQuote(m[1])}else{QUOTE=null}
}
async function loadQuote(token){
  const box=$("#qbox");box.innerHTML='<div class="empty">جاري تحميل الطلب…</div>';
  try{const q=await rpc("cat_quote_get",{p_token:token});
    if(!q){box.innerHTML='<div class="empty">ما لقينا هذا الطلب. تأكد من الرابط.<br><br><a href="#" class="primary" style="text-decoration:none">تصفح الكتالوج</a></div>';return}
    q.items.forEach(i=>i.name=cleanName(i.name));QUOTE={...q,token};QEDIT={};q.items.forEach(i=>QEDIT[i.sku]=i.qty);renderQuote();
  }catch(e){box.innerHTML='<div class="empty">تعذّر تحميل الطلب، حدّث الصفحة.</div>'}
}
function qLookup(){const o={};QUOTE.items.forEach(i=>o[i.sku]=i);return o}
function qPrices(){const o={};let any=false;QUOTE.items.forEach(i=>{if(i.price!=null&&i.price!==""){o[i.sku]=Number(i.price);any=true}});return any?o:null}
function renderQuote(){
  const q=QUOTE,L=qLookup(),P=qPrices(),open=q.status==="new"||q.status==="replied";
  const ks=Object.keys(QEDIT);let pcs=0,sum=0,all=!!P;ks.forEach(k=>{pcs+=QEDIT[k];if(P&&P[k]!=null)sum+=P[k]*QEDIT[k];else all=false});
  const changed=JSON.stringify(Object.entries(QEDIT))!==JSON.stringify(q.items.map(i=>[i.sku,i.qty]));
  const [stTxt,stCls]=STATUS[q.status]||[q.status,""];
  $("#qbox").innerHTML=`<div class="qhead"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap">
      <h2>طلب عرض سعر #${q.id}</h2><span class="status ${stCls}">${stTxt}</span></div>
    <div class="meta"><span>الاسم: <b>${esc(q.name)}</b></span><span>المدينة: <b>${esc(q.city)}</b></span>${q.type?`<span>النوع: <b>${esc(q.type)}</b></span>`:""}<span>التاريخ: <b>${dt(q.created_at)}</b></span></div>
    ${q.note?`<div class="meta">ملاحظة: <b>${esc(q.note)}</b></div>`:""}
    ${open?`<p class="mini" style="text-align:right;margin:10px 0 0">تقدر تزيد أو تنقص الكميات أو تحذف منتج، وبعدها اضغط «حفظ التعديل».</p>`:`<p class="mini" style="text-align:right;margin:10px 0 0">هذا الطلب مقفل للتعديل. لو تبي طلب جديد ارجع للكتالوج.</p>`}
  </div>
  <div class="qlist">${ks.length?ks.map(k=>{const p=L[k];return lineHTML(p,QEDIT[k],P?P[k]:null)}).join(""):'<div class="empty">حذفت كل المنتجات. احفظ أو أضف منتجات.</div>'}</div>
  <div class="tot" style="margin-top:6px"><span>${num(ks.length)} منتج · ${num(pcs)} قطعة</span>${all&&ks.length?`<b>الإجمالي: ${money(sum)}</b>`:P?`<span>بعض الأسعار ناقصة</span>`:`<span>السعر يوصلك بالعرض</span>`}</div>
  ${open&&changed?`<div class="sticky-save"><button class="primary wa" style="width:100%" id="qSave" ${ks.length?"":"disabled"}>حفظ التعديل وإرساله بالواتساب</button></div>`:""}
    <div class="qactions" style="margin-top:8px">
      ${open?`<button class="ghost" id="qAdd">＋ أضف منتجات من الكتالوج</button>`:""}
      <button class="ghost" id="qDl">⬇︎ تحميل الطلب</button>
      <a class="ghost" style="text-decoration:none;text-align:center" href="https://wa.me/${WA}?text=${encodeURIComponent("استفسار عن طلب رقم #"+q.id)}" target="_blank" rel="noopener">تواصل معنا</a>
    </div>`;
  if(open){
    const ql=$(".qlist");
    ql.onclick=e=>{const a=e.target.closest("[data-a]");if(!a)return;const sku=a.closest(".line").dataset.sku;
      const ln=a.closest(".line");
      if(a.dataset.a==="inc"){markFx(sku,1,a);QEDIT[sku]++;renderQuote()}
      else if(a.dataset.a==="dec"){if(QEDIT[sku]<=1){removeLine(ln,()=>{delete QEDIT[sku];renderQuote()});return}markFx(sku,-1,a);QEDIT[sku]--;renderQuote()}
      else if(a.dataset.a==="del"){removeLine(ln,()=>{delete QEDIT[sku];renderQuote()})}};
    ql.onchange=e=>{if(e.target.dataset.a==="set"){const sku=e.target.closest(".line").dataset.sku;const v=Math.min(100000,parseInt(e.target.value)||0);if(v>0)QEDIT[sku]=v;else delete QEDIT[sku];renderQuote()}};
    const s=$("#qSave");if(s)s.onclick=saveQuote;
    $("#qAdd").onclick=()=>{ // load quote into the catalog cart for adding
      cart={...QEDIT};save("tc_cart",cart);editing={id:q.id,token:q.token};save("tc_edit",editing);
      cust={...cust,name:q.name,city:q.city,type:q.type||cust.type};save("tc_cust",cust);
      location.hash="";renderList();updateBar();toast("أضف المنتجات، وبعدها افتح الطلب واحفظ التعديل")};
  }else{$(".qlist").querySelectorAll(".step,.del").forEach(x=>x.remove())}
  applyFx();
  $("#qDl").onclick=()=>printCart(QEDIT,{title:"طلب عرض سعر #"+q.id,sub:q.name+" · "+q.city+" ·",prices:P,lookup:L});
}
async function saveQuote(){
  const b=$("#qSave");b.disabled=true;b.textContent="جاري الحفظ…";
  try{const items=Object.keys(QEDIT).map(k=>({sku:k,qty:QEDIT[k]}));
    const r=await rpc("cat_quote_update",{p_token:QUOTE.token,p_items:items});
    if(r&&r.error){toast(r.error==="locked"?"الطلب مقفل للتعديل":"ما انحفظ، جرّب مرة ثانية");b.disabled=false;return}
    const L=qLookup();
    const msg=buildMsg({edit:true,id:QUOTE.id,name:QUOTE.name,city:QUOTE.city,type:QUOTE.type,note:QUOTE.note,
      list:Object.keys(QEDIT).map(k=>({sku:k,name:L[k].name,unit:L[k].unit,qty:QEDIT[k]})),link:BASE+"#q="+QUOTE.token});
    QUOTE.items=QUOTE.items.filter(i=>QEDIT[i.sku]).map(i=>({...i,qty:QEDIT[i.sku]}));
    toast("انحفظ التعديل ✓");renderQuote();
    location.href="https://wa.me/"+WA+"?text="+encodeURIComponent(msg);
  }catch(e){toast("صار خطأ، جرّب مرة ثانية");b.disabled=false}
}

init();
</script>
</body>
